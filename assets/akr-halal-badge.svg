<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="38" stroke="currentColor" stroke-width="1.5" fill="none"/>

  <!-- Crescent moon (above HALAL text) -->
  <path d="M 44 24 A 7 7 0 1 0 50 31" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Star next to crescent -->
  <circle cx="56" cy="25" r="1.2" fill="currentColor"/>

  <!-- HALAL text (centered) -->
  <text x="50" y="56" font-family="Arial, sans-serif" font-size="12" font-weight="800"
        text-anchor="middle" fill="currentColor" letter-spacing="1.2">HALAL</text>

  <!-- Decorative line under HALAL -->
  <line x1="36" y1="62" x2="64" y2="62" stroke="currentColor" stroke-width="1"/>

  <!-- Checkmark (bottom) -->
  <path d="M 40 72 L 47 79 L 60 66" stroke="currentColor" stroke-width="2.5"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
